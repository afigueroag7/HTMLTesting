<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Survey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f4ed;
            color: #333;
        }

        header {
            text-align: center;
            padding: 20px;
            background-color: white;
            color: #003a5c;
        }

        header img {
            max-width: 400px;
            margin-bottom: 10px;
        }

        header h1 {
            margin: 10px 0 5px;
            font-size: 24px;
        }

        main {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        main p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea, select {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #2774ae;
        }

        button {
            background-color: #2774ae;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #003a5c;
        }

        #response-message {
            display: none;
            margin-top: 20px;
            font-size: 16px;
            padding: 10px;
            border-radius: 4px;
        }

        #response-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #response-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #003a5c;
            color: white;
            margin-top: 20px;
        }

        footer p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const responseMessage = document.getElementById('response-message');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                try {
                    const formData = new FormData(form);
                    const params = new URLSearchParams();
                    for (const [key, value] of formData.entries()) {
                        params.append(key, value);
                    }

                    const response = await fetch(form.action, {
                        method: form.method,
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: params.toString(),
                    });

                    if (response.ok) {
                        responseMessage.textContent = "Form submitted successfully.";
                        responseMessage.className = "success";
                    } else {
                        responseMessage.textContent = "Sorry, we cannot process this form at this time.";
                        responseMessage.className = "error";
                    }
                } catch (error) {
                    responseMessage.textContent = "Sorry, we cannot process this form at this time.";
                    responseMessage.className = "error";
                }

                responseMessage.style.display = "block";
            });
        });
    </script>
</head>
<body>

    <header>
        <img src="logo.png" alt="Company Logo"><br>
        <h1 style="display:inline">Marketing Survey - </h1><h1 id="project-name" style="display:inline"></h1>
    </header>

    <main>
        <p>Dear Leadership,</p>
        <p>Please provide your feedback on Project UPlan Ideas roll-out submitting the form below:</p>
        <form action="https://default61c54b5a63c5445da99df987800a2d.de.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e92a9e56770e472b8c7757e26b6fbd14/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=oZafxVy8KB_f4MUx8cJ7pRx-mVLRrfBWbK5cjmJKnL0" method="POST">
            
            <label for="projectName">Project Name</label>
            <input type="text" id="name-input" name="projectName" readonly="readonly" />

            <label for="projectManager">Project Manager</label>
            <input type="text" id="manager-input" name="projectManager" readonly="readonly" />

            <label for="completedOn">Project Completed on</label>
            <input type="text" id="completedon-input" name="completedOn" readonly="readonly" />

            <label for="projectDescription">Project description</label>
            <input type="text" id="description-input" name="projectDescription" readonly="readonly" />

            <label for="wf-id">WF ID</label>
            <input type="text" id="id-input" name="wf-id" readonly="readonly" />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email" required>

            <label for="grade">Describe your overall Marketing project experience.</label>
            <select id="grade" name="grade" placeholder="Select an option" type="text" list="grades" required>
                <option name="table1" value="1"  selected="true" disabled="disabled">Select an option</option>
                <option name="grade1" value="Good - I'm Satisfied">Good - I'm Satisfied</option>
                <option name="grade2" value="Neutral">Neutral</option>
                <option name="grade3" value="Bad - I'm Unsatisfied">Bad - I'm Unsatisfied</option>
            </select>

            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" rows="5" placeholder="Your comments" required></textarea>

            <button type="submit">Submit</button>
        </form>

        <div id="response-message"></div>
    </main>

    <script>
        // Get the full query string from the current URL
        const queryString = window.location.search;
        // Create a URLSearchParams object
        const urlParams = new URLSearchParams(queryString);

        // Get the value of a specific parameter (e.g., 'name')
        const projectName = urlParams.get('project');
        const projectManager = urlParams.get('manager');
        const completedOn = urlParams.get('completedon');
        const projectDescription = urlParams.get('description');
        const wfid = urlParams.get('wfid');

        if (projectName) {
            document.getElementById('project-name').innerHTML = `${projectName}`;
        }
        if (projectName) {
            document.getElementById('name-input').value = `${projectName}`;
        }
        if (projectManager) {
            document.getElementById('manager-input').value = `${projectManager}`;
        }
        if (completedOn) {
            document.getElementById('completedon-input').value = `${completedOn}`;
        }
        if (projectDescription) {
            document.getElementById('description-input').value = `${projectDescription}`;
        }
        if (wfid) {
            document.getElementById('id-input').value = `${wfid}`;
        }

    </script>

</body>
</html>
